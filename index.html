<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mustache Man</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div class="title">MUSTACHE MAN</div>
    <div class="subtitle">Find the vanished hero. Roam the city. Follow the clues.</div>
    <div id="mission">Mission: Search the city for the vanished wartime hero.</div>
    <div id="objective">Clues found: 0 / 3</div>
    <div id="controls">
      Move: WASD / Arrow Keys &nbsp;|&nbsp; Jump: Space &nbsp;|&nbsp; Sprint: Shift &nbsp;|&nbsp; Interact: E &nbsp;|&nbsp; Camera drag: Mouse
    </div>
  </div>

  <div id="messageBox" class="hidden"></div>
  <div id="crosshair"></div>
  <canvas id="game"></canvas>

  <script type="module" src="game.js"></script>
</body>
</html>
